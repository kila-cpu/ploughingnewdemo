<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Booking Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* NPA green and gold from the championship logo; the portal's orange kept for actions */
  --green-900:#0f3d24; --green-800:#155232; --green-700:#1c6b40; --green-600:#25854f; --green-100:#e3f2e8; --green-50:#f1f8f3;
  --gold:#f0b429; --orange:#f28c18; --orange-600:#e07a08; --orange-50:#fff4e6; --orange-100:#ffe7c7;
  --bg:#f4f6f3; --card:#fff; --line:#e1e6e1; --line-2:#eef1ee;
  --ink:#17221b; --ink-2:#3d4a41; --muted:#6b776f; --red:#c93a2e; --red-50:#fdecea;
  --r:14px; --shadow:0 1px 2px rgba(16,40,24,.06),0 4px 16px rgba(16,40,24,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--orange-600);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- logo lockup (placeholder for NPA's artwork) ---------- */
.logo{display:flex;align-items:center;gap:10px;color:var(--green-800);text-decoration:none}
.logo .badge{width:42px;height:42px;border-radius:50%;background:var(--green-700);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 3px var(--gold)}
.logo .badge svg{width:24px;height:24px}
.logo .t{display:flex;flex-direction:column;line-height:1.05}
.logo .t b{font-size:12.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.logo .t small{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
.logo.big{flex-direction:column;text-align:center;gap:14px}
.logo.big .badge{width:76px;height:76px;box-shadow:inset 0 0 0 5px var(--gold)}
.logo.big .badge svg{width:42px;height:42px}
.logo.big .t b{font-size:20px} .logo.big .t small{font-size:12px;margin-top:6px}

/* ---------- header + stepper ---------- */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);}
.top .in{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.top h1{margin:0;font-size:16px;font-weight:600;color:var(--ink-2)}
.top h1 span{color:var(--green-700)}
.top .sp{flex:1}
.acct{position:relative}
.acct>button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 5px;color:var(--ink-2);font-weight:500}
.acct>button:hover{background:var(--green-50)}
.av{width:30px;height:30px;border-radius:50%;background:var(--green-100);color:var(--green-800);display:grid;place-items:center;font-size:12px;font-weight:700}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:6px;display:none}
.acct.open .menu{display:block}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line-2);margin-bottom:4px}
.menu .who b{display:block} .menu .who small{color:var(--muted)}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--ink-2)}
.menu a:hover{background:var(--green-50);text-decoration:none}
.vr{width:1px;height:36px;background:var(--line)}

.steps{max-width:1120px;margin:0 auto;padding:0 24px 12px;display:flex;gap:6px;list-style:none;counter-reset:s}
.steps li{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);padding-top:10px;border-top:3px solid var(--line-2);min-width:0}
.steps li .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line-2);font-size:11px;flex:none}
.steps li span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.done{border-color:var(--green-600);color:var(--green-700)} .steps li.done .n{background:var(--green-600);color:#fff}
.steps li.now{border-color:var(--orange);color:var(--ink)} .steps li.now .n{background:var(--orange);color:#fff}
.steps li a{color:inherit;display:contents}

/* ---------- page ---------- */
main{max-width:1120px;margin:0 auto;padding:28px 24px 120px}
.ph{margin-bottom:20px}
.ph .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-600)}
.ph h2{margin:4px 0 4px;font-size:26px;letter-spacing:-.02em}
.ph p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px}
.card>.hd{padding:18px 24px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.card>.hd .ico{width:34px;height:34px;border-radius:10px;background:var(--green-50);color:var(--green-700);display:grid;place-items:center}
.card>.hd h3{margin:0;font-size:16px}
.card>.hd small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.card>.bd{padding:22px 24px}

.notice{display:flex;gap:14px;background:var(--orange-50);border:1px solid var(--orange-100);border-radius:12px;padding:16px 18px;color:#5b3a10;font-size:14px}
.notice>svg.i{color:var(--orange-600);margin-top:2px}
.notice p{margin:0 0 6px} .notice p:last-child{margin:0}
.notice ol{margin:4px 0 8px;padding-left:20px} .notice li{margin-bottom:4px}

/* ---------- actions ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 22px;font-weight:600;border:1px solid transparent;background:#fff;color:var(--ink-2);transition:background .15s,box-shadow .15s}
.btn.pri{background:var(--orange);color:#fff;box-shadow:0 4px 14px rgba(242,140,24,.32)}
.btn.pri:hover{background:var(--orange-600)}
.btn.sec{border-color:var(--line);} .btn.sec:hover{background:var(--green-50)}
.btn.ghost{background:none} .btn.ghost:hover{background:var(--line-2)}
.btn:disabled{background:#e7e9e7;color:#a5aca7;box-shadow:none;cursor:not-allowed;border-color:transparent}
.actbar{position:sticky;bottom:0;z-index:10;background:rgba(244,246,243,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);margin:24px -24px -120px;padding:14px 24px}
.actbar .in{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.actbar .hint{margin-right:auto;font-size:13px;color:var(--muted)}
.actbar .hint b{color:var(--ink-2)}

/* ---------- fields (outlined, floating label) ---------- */
.grid{display:grid;gap:18px 20px;grid-template-columns:repeat(12,1fr)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}
.fld{position:relative}
.fld .box{position:relative;display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.fld .box:focus-within{border-color:var(--green-600);box-shadow:0 0 0 4px rgba(37,133,79,.12)}
.fld input,.fld select{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:22px 14px 8px;appearance:none}
.fld select{padding-right:36px;cursor:pointer}
.fld label{position:absolute;left:15px;top:15px;color:var(--muted);pointer-events:none;transition:all .15s;font-size:15px;white-space:nowrap}
.fld.has-pre label{left:96px}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld select+label{top:6px;font-size:11.5px;font-weight:600;color:var(--green-700)}
.fld .end{display:flex;align-items:center;gap:8px;padding-right:12px;color:var(--muted)}
.fld .caret{position:absolute;right:12px;pointer-events:none;color:var(--muted)}
.fld .pre{border:0;border-right:1.5px solid var(--line);background:var(--line-2);border-radius:8px 0 0 8px;align-self:stretch;padding:0 8px 0 12px;width:82px;font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);outline:0;cursor:pointer}
.fld .help{font-size:12.5px;color:var(--muted);margin:5px 2px 0}
.fld .count{position:absolute;right:4px;bottom:-19px;font-size:11.5px;color:var(--muted)}
.fld.err .box{border-color:var(--red);background:var(--red-50)}
.fld.err .help{color:var(--red)}
.req{color:var(--red)}
.tip{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--muted);cursor:help}
.tip:hover,.tip:focus{color:var(--green-700);outline:0}
.tip .bubble{position:absolute;bottom:calc(100% + 8px);right:-10px;width:240px;background:var(--ink);color:#fff;font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:8px;display:none;z-index:5;font-weight:400}
.tip:hover .bubble,.tip:focus .bubble{display:block}

.chk{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--ink-2);user-select:none}
.chk input{appearance:none;width:20px;height:20px;border:1.5px solid #b9c2bc;border-radius:6px;margin:0;display:grid;place-items:center;cursor:pointer;transition:all .15s;flex:none}
.chk input:checked{background:var(--orange);border-color:var(--orange)}
.chk input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg .opt{border:1.5px solid var(--line);border-radius:10px;padding:11px 14px}
.seg .opt:has(input:checked){border-color:var(--orange);background:var(--orange-50)}
.sub{background:var(--line-2);border-radius:12px;padding:18px;margin:16px 0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(1200px 500px at 50% -10%,var(--green-100),transparent),linear-gradient(180deg,#f7faf6,var(--bg))}
.login .card{width:100%;max-width:440px;padding:36px 36px 28px;margin:0}
.login .ev{text-align:center;margin:22px 0 26px}
.login .ev h2{margin:0 0 10px;font-size:21px;letter-spacing:-.01em}
.login .meta{display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--ink-2);font-size:14px}
.login .meta span{display:inline-flex;align-items:center;gap:8px}
.login .meta svg.i{color:var(--green-700);width:16px;height:16px}
.login form{display:grid;gap:22px}
.login .btn.pri{width:100%;border-radius:10px;padding:13px}
.login .alt{display:flex;justify-content:space-between;margin-top:16px;font-size:13.5px}
.login .demo{margin-top:20px;font-size:12.5px;color:var(--muted);text-align:center;border-top:1px solid var(--line-2);padding-top:14px}
.iconbtn{border:0;background:none;color:var(--muted);padding:4px;border-radius:6px;display:grid;place-items:center}
.iconbtn:hover{color:var(--ink);background:var(--line-2)}

/* ---------- welcome ---------- */
.hero{background:linear-gradient(135deg,var(--green-800),var(--green-600));color:#fff;border-radius:var(--r);padding:32px 34px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:34px solid rgba(240,180,41,.22)}
.hero h2{margin:0 0 16px;font-size:30px;line-height:1.15;letter-spacing:-.02em;max-width:640px}
.facts{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:1}
.facts span{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500}
.letter{max-width:760px;font-size:15.5px;color:var(--ink-2)}
.letter p{margin:0 0 14px}
.letter ul{list-style:none;padding:0;margin:4px 0 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.letter li{display:flex;gap:10px;background:var(--green-50);border-radius:10px;padding:12px 14px;font-size:14.5px}
.letter li svg.i{color:var(--green-600);margin-top:2px}
.help-box{display:flex;flex-wrap:wrap;gap:10px 24px;background:var(--line-2);border-radius:12px;padding:14px 18px;margin:6px 0 18px}
.help-box a,.help-box span{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.sig b{display:block;color:var(--ink)} .sig small{color:var(--muted)}

/* ---------- documents ---------- */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.doc{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;color:var(--ink);text-align:left;transition:all .15s}
.doc:hover{border-color:var(--orange);text-decoration:none;box-shadow:var(--shadow)}
.doc .fi{width:40px;height:46px;border-radius:6px;background:var(--orange-50);color:var(--orange-600);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none;position:relative}
.doc .fi::before{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 10px 10px 0;border-color:transparent var(--bg) transparent transparent}
.doc .nm{flex:1;font-weight:600;font-size:14px;line-height:1.3}
.doc .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.doc .st{color:var(--muted)}
.doc.seen .st{color:var(--green-600)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:13.5px;color:var(--muted)}
.bar{flex:1;max-width:240px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green-600);border-radius:9px;transition:width .3s}

/* ---------- terms viewer ---------- */
.viewer{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#525a55}
.viewer .tb{display:flex;align-items:center;gap:10px;background:#3c433f;color:#e9ece9;padding:8px 14px;font-size:13px}
.viewer .tb .sp{flex:1}
.viewer .tb button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:6px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12.5px}
.viewer .pages{height:440px;overflow:auto;padding:24px}
.pg{background:#fff;max-width:720px;margin:0 auto 18px;padding:44px 52px;box-shadow:0 2px 10px rgba(0,0,0,.3);min-height:560px}
.pg .ttl{text-align:center;font-family:Georgia,'Times New Roman',serif}
.pg .ttl .ev{font-family:Inter,sans-serif;font-size:14px;color:#222;margin:14px 0 4px}
.pg .ttl .cl{color:#d71920;font-weight:700;font-size:16px}
.pg .ttl .big{color:#e0151d;font-weight:700;font-size:54px;line-height:1.05;margin:28px 0 6px;letter-spacing:.01em}
.pg .ttl .big2{color:#e0151d;font-weight:700;font-size:44px;line-height:1.05}
.pg .ln{height:9px;background:#e9ecea;border-radius:3px;margin:10px 0}
.pg h4{margin:26px 0 12px;font-size:14px}
.agree{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 24px;text-align:center}
.agree .chk{font-weight:600;font-size:15px}
.agree small{color:var(--muted);font-style:italic}

.area{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.area-name{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--green-800)}
.past{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.past span{font-size:13px;background:var(--line-2);border-radius:999px;padding:4px 12px;color:var(--ink-2)} .past b{margin-right:4px}
.stand-tbc{border:1.5px dashed #c9d2cc;border-radius:12px;padding:12px 18px;text-align:center;min-width:190px}
.stand-tbc small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stand-tbc b{display:block;font-size:17px;margin:2px 0} .stand-tbc span{font-size:12.5px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--line-2);width:44px;height:46px;font-size:20px;color:var(--ink-2)} .stepper button:hover{background:var(--green-100)}
.stepper input{width:64px;border:0;outline:0;text-align:center;font:inherit;font-size:18px;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper span{color:var(--muted);padding-right:10px}
.fld textarea{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--ink);padding:24px 14px 10px;resize:vertical}
.fld textarea:focus+label,.fld textarea:not(:placeholder-shown)+label{top:6px;font-size:11.5px;font-weight:600;color:var(--green-700)}
.est{width:100%;border-collapse:collapse;font-size:14.5px} .est td{padding:9px 0;border-bottom:1px solid var(--line-2)} .est td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.est td span{display:block;font-size:12.5px;color:var(--muted)} .est .tot td{font-weight:700;font-size:16px;border:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:all .25s;z-index:99;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.wf{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--line-2);color:var(--muted);border-radius:999px;padding:3px 10px}
.empty{text-align:center;padding:46px 24px;color:var(--muted)}
.empty .ico{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:var(--green-50);color:var(--green-700);display:grid;place-items:center}
.empty h3{color:var(--ink);margin:0 0 6px}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 24px;text-align:left;max-width:760px;margin:22px auto 0;font-size:14px}
.summary div{padding:8px 0;border-bottom:1px solid var(--line-2)} .summary small{display:block;color:var(--muted);font-size:12px}

@media (max-width:860px){
  .top .in{padding:10px 16px;gap:10px} .top h1{font-size:14px} .top h1 .long{display:none}
  .logo .t,.vr,.acct>button .nm{display:none}
  .acct>button{padding:4px}
  .steps{padding:0 16px 10px;gap:4px} .steps li span.l{display:none} .steps li.now{flex:4} .steps li.now span.l{display:inline}
  main{padding:20px 16px 120px}
  .actbar{margin:24px -16px -120px;padding:12px 16px}
  .card>.hd,.card>.bd{padding-left:16px;padding-right:16px}
  .c3,.c4,.c6,.c8{grid-column:span 12}
  .hero{padding:24px 20px} .hero h2{font-size:23px}
  .letter ul{grid-template-columns:1fr}
  .pg{padding:26px 22px;min-height:0} .pg .ttl .big{font-size:32px} .pg .ttl .big2{font-size:27px}
  .viewer .pages{height:360px;padding:14px}
  .actbar .hint{display:none}
  .login .card{padding:28px 22px 22px}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
// Exhibitor booking portal wireframe. Everything runs in the browser; nothing is sent anywhere.
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = {
  user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
  down: 'M6 9l6 6 6-6', next: 'M9 18l6-6-6-6', back: 'M15 18l-6-6 6-6',

function fld(label, id, val, o = {}) {
  const tip = o.tip ? `<span class="tip" tabindex="0">${ic('info')}<span class="bubble">${o.tip}</span></span>` : '';
  const pre = o.pre ? `<select class="pre" aria-label="Country code" onchange="A.set('${o.pre[0]}',this.value)">${CODES.map(c => `<option${c === o.pre[1] ? ' selected' : ''}>${c}</option>`).join('')}</select>` : '';
  let input;
  const h = o.sp ? `A.sp('${id}',this.value,1)` : `A.set('${id}',this.value)`;
  if (o.options) input = `<select id="${id}" onchange="${h}">${o.options.map(c => `<option${c === val ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select><label for="${id}">${label}</label><span class="caret">${ic('down')}</span>`;
  else input = `<input id="${id}" type="${o.type || 'text'}" value="${esc(val)}" placeholder=" " ${o.attrs || ''} ${o.ro ? 'readonly' : ''} ${o.raw ? '' : `oninput="${h}"`}><label for="${id}">${label}${o.req ? ' <span class="req">*</span>' : ''}</label>`;
  const end = o.end || tip ? `<span class="end">${o.end || ''}${tip}</span>` : '';
  return `<div class="fld${pre ? ' has-pre' : ''}${o.err ? ' err' : ''} ${o.cls || ''}" data-f="${id}"><div class="box">${pre}${input}${end}</div>${o.err ? `<div class="help">${o.err}</div>` : o.help ? `<div class="help">${o.help}</div>` : ''}</div>`;
}

// ---------- step 2 placeholder ----------
// ---------- step 2: exhibition space ----------
// Exhibitors book space in their assigned area only. They never pick a stand: NPA allocates it after bookings close.
const money = n => '€' + n.toLocaleString('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function vSpace() {
  const sp = space, net = sp.frontage * RATE.now, vat = net * .23;
  return chrome('space', `
    <div class="ph"><div class="eyebrow">Booking form</div><h2>Step 2 - Exhibition Space</h2><p>Tell us how much space you need in your area. Your stand number is allocated by the NPA.</p></div>
    <div class="card"><div class="hd"><span class="ico">${ic('pin')}</span><div><h3>Your area</h3><small>Assigned by the NPA based on where you exhibited in previous years</small></div></div><div class="bd">
      <div class="area"><div><div class="lbl" style="margin:0 0 4px">Outdoor exhibition area</div><div class="area-name">${PROFILE.area}</div>
        <div class="past">${PROFILE.past.map(([y, l]) => `<span><b>${y}</b> ${l}</span>`).join('')}</div></div>
        <div class="stand-tbc"><small>Your stand</small><b>To be allocated</b><span>after 28th February 2027</span></div></div>
      <div class="notice" style="margin-top:18px">${ic('info')}<div><p><b>You don't choose a stand number.</b> Once bookings close on 28th February 2027, the NPA allocates every stand within its area. We'll email you your stand number and it will show here.</p>
        <p>Need to move to a different area? Contact <a href="mailto:npaexhibition@npa.ie">npaexhibition@npa.ie</a> before you book.</p></div></div>
    </div></div>
    <div class="card"><div class="hd"><span class="ico">${ic('build')}</span><div><h3>Space required</h3><small>Outdoor sites are booked by the metre of frontage</small></div></div><div class="bd">
      <div class="grid">
        <div class="c6"><div class="lbl">Frontage (metres)</div>
          <div class="stepper"><button type="button" onclick="A.front(-1)" aria-label="Less">−</button><input id="frontage" type="number" min="5" max="60" value="${sp.frontage}" onchange="A.front(0,this.value)"><span>m</span><button type="button" onclick="A.front(1)" aria-label="More">+</button></div>
          <div class="help" style="font-size:12.5px;color:var(--muted);margin-top:6px">Minimum 5 metres.</div></div>
        <div class="c6"><div class="lbl">Site depth</div><div class="seg">
          <label class="chk opt"><input type="radio" name="depth" ${sp.deep ? '' : 'checked'} onchange="A.sp('deep',false)">Standard depth</label>
          <label class="chk opt"><input type="radio" name="depth" ${sp.deep ? 'checked' : ''} onchange="A.sp('deep',true)">18m deep site</label></div></div>
        ${fld('Category', 'category', sp.category, { cls: 'c6', options: CATS, sp: true, help: 'The categories NPA has opened for your area.' })}
        ${fld('Sharing your stand with (optional)', 'sharing', sp.sharing, { cls: 'c6', sp: true })}
        <div class="c12 fld"><div class="box"><textarea id="particulars" rows="3" placeholder=" " oninput="A.sp('particulars',this.value,1)">${esc(sp.particulars)}</textarea><label for="particulars">What will you display?</label></div></div>
      </div>
    </div></div>
    <div class="card"><div class="hd"><span class="ico">${ic('vat')}</span><div><h3>Estimated cost</h3><small>Final price is confirmed on your invoice</small></div></div><div class="bd">
      <table class="est"><tr><td>Space · ${sp.frontage}m × ${money(RATE.now)} <span>Standard rate, ${RATE.unit}</span></td><td>${money(net)}</td></tr>
        <tr><td>VAT 23%</td><td>${money(vat)}</td></tr><tr class="tot"><td>Total</td><td>${money(net + vat)}</td></tr></table>
      <p style="margin:12px 0 0;font-size:13.5px;color:var(--muted)">Bookings received after 28th February 2027 are charged at ${money(RATE.later)} ${RATE.unit}.</p>
    </div></div>
    <div class="actbar"><div class="in"><span class="hint">${PROFILE.area} · ${sp.frontage}m frontage</span>
      <button class="btn ghost" onclick="go('contact')">${ic('back')}Back</button>
      <button class="btn sec" onclick="A.saveSpace()">${ic('save')}Save</button>
      <button class="btn pri" onclick="A.saveSpace(true)">Next ${ic('next')}</button></div></div>`);
}

// ---------- step 3 placeholder ----------
function vNext() {
  const f = form, sp = space;
  const rows = [['Company', f.company], ['Contact', `${f.first} ${f.last}`], ['Email', f.email], ['Mobile', `${f.mobCode} ${f.mob}`], ['Area', PROFILE.area], ['Stand', 'To be allocated by the NPA'], ['Space', `${sp.frontage}m frontage${sp.deep ? ', 18m deep' : ''}`], ['Category', sp.category]];
  return chrome('next', `<div class="card"><div class="empty"><div class="ico">${ic('check')}</div>
    <h3>Space request saved</h3><p style="margin:0 auto;max-width:540px">The remaining steps of the booking form (structure, utilities and payment) weren't in the screenshots we were sent, so they aren't wireframed yet.</p>
    <div class="summary">${rows.map(([k, v]) => `<div><small>${k}</small>${esc(v)}</div>`).join('')}</div>
    <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn sec" onclick="go('space')">${ic('back')}Edit exhibition space</button><a class="btn pri" href="index.html#/allocation" style="text-decoration:none">See stand allocation in the admin ${ic('ext')}</a></div>
  </div></div>`);
}

// ---------- actions ----------
const go = r => { location.hash = '#/' + r; };
const A = {
  toast,
  menu(e) { e.stopPropagation(); $('#acct').classList.toggle('open'); },
  loginCheck() { const u = $('#lu').value.trim(), p = $('#lp').value; $('#lpc').textContent = `${p.length} / 25`; $('#lgo').disabled = !(u && p); },
  peek() { const p = $('#lp'); p.type = p.type === 'password' ? 'text' : 'password'; },
  login(e) { e.preventDefault(); S.user = $('#lu').value.trim(); store.set('user', S.user); go('welcome'); },
  reset(e) { e.preventDefault(); if (!$('#fu').value.trim()) return toast('Enter your username or email'); toast('If that account exists, a reset link is on its way'); go('login'); },
  logout() { S.user = null; store.set('user', null); go('login'); },
  open(i) { if (!S.seen.includes(i)) { S.seen.push(i); store.set('seen', S.seen); } toast(`Opens ${DOCS[i]}.pdf in a new tab`); render(); },
  front(d, v) { const n = Math.max(5, Math.min(60, Math.round(v != null ? +v || 5 : space.frontage + d))); space.frontage = n; rerender(); },
  sp(k, v, soft) { space[k] = v; if (!soft) rerender(); },
  saveSpace(next) {
    for (const k of ['category', 'sharing']) { const el = document.getElementById(k); if (el) space[k] = el.value; }
    S.space = { ...space }; store.set('space', S.space);
    if (next) go('next'); else toast('Saved. You can come back and finish this later.');
  },
  agree(v) { S.agreed = v; store.set('agreed', v); $('#startbtn').disabled = !v; },
  set(k, v) {
    form[k] = v;
    if (k === 'company' && form.sameAsCompany) { form.signage = v; const s = $('#signage'); if (s) s.value = v; }
    if (tried) { const el = document.querySelector(`[data-f="${k}"]`); if (el && !errors(form)[k]) { el.classList.remove('err'); el.querySelector('.help')?.remove(); } }
    $('#savebtn').disabled = !dirty(); $('#hint').innerHTML = hint();
  },
  vat(k, v) { form[k] = v; if (v) form[k === 'notVat' ? 'vatExempt' : 'notVat'] = false; rerender(); },
  same(v) { form.sameAsCompany = v; if (v) form.signage = form.company; rerender(); },
  save() { S.saved = { ...form }; store.set('form', S.saved); $('#savebtn').disabled = true; toast('Saved. You can come back and finish this later.'); },
  next() {
    tried = true;
    const e = errors(form);
    if (Object.keys(e).length) { rerender(); const first = document.querySelector('.fld.err'); first?.scrollIntoView({ behavior: 'smooth', block: 'center' }); first?.querySelector('input,select')?.focus({ preventScroll: true }); toast(`Please complete the ${Object.keys(e).length} highlighted field${Object.keys(e).length > 1 ? 's' : ''}`); return; }
    S.saved = { ...form }; store.set('form', S.saved); go('space');
  },
};
document.addEventListener('click', () => $('#acct')?.classList.remove('open'));
function rerender() { const y = scrollY; render(); scrollTo(0, y); }

// ---------- router ----------
const ROUTES = { login: () => vLogin(), forgot: () => vLogin(true), welcome: vWelcome, documents: vDocuments, terms: vTerms, contact: vContact, space: vSpace, next: vNext };
function render() {
  let r = location.hash.replace(/^#\/?/, '') || 'login';
  if (!ROUTES[r]) r = 'login';
  if (!S.user && r !== 'login' && r !== 'forgot') r = 'login';
  if ((r === 'contact' || r === 'space' || r === 'next') && !S.agreed) r = 'terms';
  if ((r === 'space' || r === 'next') && !(S.saved && complete(S.saved))) r = 'contact';
  if (r === 'next' && !S.space) r = 'space';
  if (location.hash !== '#/' + r) history.replaceState(null, '', '#/' + r);
  document.title = r === 'login' || r === 'forgot' ? 'Login · Trade Booking Portal' : 'Trade Booking Portal';
  $('#root').innerHTML = ROUTES[r]();
}
addEventListener('hashchange', () => { tried = false; render(); scrollTo(0, 0); });
render();
</script>
</body>
</html>
